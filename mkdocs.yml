
site_name: Wioleta Kijewska
site_description: Personal website and professional portfolio
site_author: Wioleta Kijewska

site_url: https://Wiolcia.github.io/

theme:
  name: material

  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  font:
    text: Roboto
    code: Roboto Mono

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

  icon:
    logo: material/account-circle

nav:
  - Home: index.md
  - About: about.md
  - CV: cv.md
  - Projects: projects.md
  - Publications: publications.md
  - Contact: contact.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
